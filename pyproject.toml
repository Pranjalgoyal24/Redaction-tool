[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "redaction-tool"
version = "1.0.0"
description = "Enterprise PII Redaction & Anonymization Engine for DOCX documents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Priyanjal Goyal"}
]
keywords = ["pii", "redaction", "anonymization", "nlp", "presidio", "spacy", "docx"]

dependencies = [
    "python-docx>=1.1.0",
    "spacy>=3.7.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "faker>=24.0.0",
    "pytest>=8.0.0",
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9"
]

[project.scripts]
redact = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
